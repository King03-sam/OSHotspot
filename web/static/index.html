                        </span>
                        <span class="nav-label">Captive Portal</span>
                    </a>
                    <a href="#" class="nav-item" data-section="span" title="SPAN Analysis" onclick="navigate('span'); return false;">

                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>

                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>

        </aside>

        <!-- Main content area -->
        <div class="main">

            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button type="button" class="icon-btn only-mobile" id="menuToggle" onclick="toggleSidebar()" aria-label="Toggle menu">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="page-title">
                        <h1 id="pageTitle">Overview</h1>
                        <span id="pageSubtitle" class="page-subtitle">Real-time status at a glance</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="topbar-status" id="topbarStatus" role="status">
                        <span class="status-dot" id="topbarStatusDot" aria-hidden="true"></span>
                        <span id="topbarStatusText">Checking…</span>
                        <span class="topbar-uptime mono" id="topbarUptime"></span>
                    </div>
                    <span class="topbar-divider" aria-hidden="true"></span>
                    <button type="button" class="icon-btn icon-btn-sm" onclick="refreshAll()" aria-label="Refresh" title="Refresh now">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    </button>
                    <button type="button" class="icon-btn icon-btn-sm" onclick="openLogoutModal()" aria-label="Logout" title="Logout">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </header>

            <!-- Content scroll area, sections are injected here by each module's render*() -->
            <main class="content" id="content"></main>
        </div>
    </div>

    <!-- Toast notifications get appended here at runtime -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- Load order matters: core/api/theme/toast first (shared foundation),
         then nav.js, then one file per dashboard section (each renders its
         own HTML via render*()), then live.js (the unified SSE client) and
         app.js which wires everything together and boots the app on
         DOMContentLoaded. -->
    <script src="/js/core.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/status.js"></script>
    <script src="/js/clients.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/actions.js"></script>
    <script src="/js/qr.js"></script>
    <script src="/js/doctor.js"></script>
    <script src="/js/logs.js"></script>
    <script src="/js/events.js"></script>
    <script src="/js/traffic.js"></script>
    <script src="/js/activity.js"></script>
    <script src="/js/policy.js"></script>
    <script src="/js/about.js"></script>
    <script src="/js/users.js"></script>
    <script src="/js/captive.js"></script>
    <script src="/js/span.js"></script>
    <script src="/js/mail.js"></script>
    <script src="/js/vpn.js"></script>
    <script src="/js/audit.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/live.js"></script>

    <script src="/js/app.js"></script>
</body>
</html>
